# Gera a animação da "cobrinha" que come o grid de contribuições do GitHub
# e publica o SVG resultante numa branch chamada "output" — que é de onde o
# README.md lê a imagem (raw.githubusercontent.com/.../output/...svg).
#
# Baseado na action oficial: https://github.com/Platane/snk

name: generate snake animation

on:
  schedule:
    - cron: "0 6 * * *"   # roda todo dia às 6h UTC (~3h em Manaus)
  workflow_dispatch: {}    # também permite rodar manualmente pelo GitHub
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: scasttro7
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
