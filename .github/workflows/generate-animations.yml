name: generate profile animations

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cria as pastas PRIMEIRO
      - name: Create output folders
        run: |
          mkdir -p snake
          mkdir -p forest
          mkdir -p final

      # Depois gera a cobrinha
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-contribution-grid-snake.svg
            snake/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Gera a floresta
      - name: Generate forest animation
        run: |
          node scripts/generate-forest.mjs "${{ github.repository_owner }}" forest/forest-contribution-grid.svg

      # Junta tudo
      - name: Assemble final output
        run: |
          cp snake/* final/
          cp forest/* final/

      # Publica
      - name: Push animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: final
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
